[project]
name = "common"
version = "0.1.0"
description = "Cross-cutting utilities: logging, config, exceptions and telemetry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "pydantic-settings>=2.7.0",
    "starlette>=0.45.0",
    "structlog>=24.4.0",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
