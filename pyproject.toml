[project]
name = "enterprise-monorepo"
version = "0.1.0"
description = "Production-grade 4-contributor monorepo architecture"
requires-python = ">=3.11"
dependencies = [
    "api",
    "contracts",
    "common",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/contracts",
    "packages/common"
]

[tool.uv]
package = false

[tool.uv.sources]
api = { workspace = true }
contracts = { workspace = true }
common = { workspace = true }

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "node_modules",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/contracts/tests", "packages/common/tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
pythonpath = [
    "apps/api/src",
    "packages/contracts/src",
    "packages/common/src",
]
addopts = "-v --strict-markers -p no:warnings"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["apps/api", "packages"]
exclude = [".venv", "node_modules"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
